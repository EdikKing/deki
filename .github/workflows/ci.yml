name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.4.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:electron
      - if: runner.os == 'macOS'
        run: pnpm test:electron
      - if: runner.os == 'Windows'
        run: pnpm test:electron:launch
      - run: pnpm package:dir
